plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    // Jar name in the Modrinth style: lucariomorph-fabric-26.3-1.2.0.jar
    // (Gradle appends "-<mod_version>" to archivesName itself)
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
    // Mod Menu (optional integration): compile against it, but it is NOT required
    // at runtime — the "modmenu" entrypoint class is only ever loaded by Mod Menu itself.
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // 22.x requires MC >= 26.4; 21.0.0 targets 26.3.
    // Plain compileOnly: MC 26.3 ships unobfuscated, so no remap pass is needed,
    // and the jar must NOT leak into runtime deps (Mod Menu stays optional).
    compileOnly "com.terraformersmc:modmenu:21.0.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Explicit toolchain: Gradle picks/locates a Java 25 JDK for compilation
    // (together with the Foojay resolver in settings.gradle it is downloaded automatically).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
